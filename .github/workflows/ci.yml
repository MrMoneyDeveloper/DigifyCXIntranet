name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DigifyCXIntranet.sln

      - name: Build
        run: dotnet build DigifyCXIntranet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DigifyCXIntranet.sln --no-build --configuration Release
